<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c6ffe8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="220" fill="url(#glow)"/>
  <circle cx="150" cy="250" r="160" fill="url(#glow)"/>

  <!-- faint code lines pattern -->
  <g opacity="0.12" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ffffff">
    <text x="40" y="40">const build = () =&gt; {</text>
    <text x="60" y="60">deploy(project);</text>
    <text x="40" y="80">};</text>
    <text x="900" y="240">// status: ready</text>
    <text x="900" y="260">export default App;</text>
  </g>

  <!-- decorative code bracket motif -->
  <g stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 90 110 L 60 150 L 90 190"/>
    <path d="M 190 110 L 220 150 L 190 190"/>
  </g>
  <circle cx="140" cy="150" r="5" fill="#00f5a0"/>
  <circle cx="140" cy="150" r="10" fill="none" stroke="#00f5a0" stroke-width="2" opacity="0.5"/>

  <!-- title -->
  <text x="280" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)">
    PROJECT NAME
  </text>
  <text x="282" y="190" font-family="Consolas, Menlo, monospace" font-size="20" fill="#8de8c9">
    &lt; your tagline goes here /&gt;
  </text>

  <!-- bottom accent bar -->
  <rect x="0" y="292" width="1200" height="8" fill="url(#accent)"/>
</svg>
