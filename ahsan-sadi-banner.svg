<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="240" fill="url(#glow1)"/>
  <circle cx="130" cy="280" r="200" fill="url(#glow2)"/>

  <!-- faint dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="900" cy="40" r="2"/><circle cx="940" cy="40" r="2"/><circle cx="980" cy="40" r="2"/>
    <circle cx="900" cy="70" r="2"/><circle cx="940" cy="70" r="2"/><circle cx="980" cy="70" r="2"/>
    <circle cx="900" cy="100" r="2"/><circle cx="940" cy="100" r="2"/><circle cx="980" cy="100" r="2"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="90" width="6" height="70" rx="3" fill="url(#accent)"/>

  <!-- name -->
  <text x="108" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#nameGrad)">
    Ahsan Sadi
  </text>
  <!-- title -->
  <text x="110" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#93c5fd">
    Full Stack Developer
  </text>

  <!-- tagline -->
  <text x="110" y="205" font-family="Consolas, Menlo, monospace" font-size="14" fill="#8b949e">
    Building end-to-end web applications with modern JavaScript technologies
  </text>

  <!-- tech stack badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <!-- React -->
    <rect x="110" y="235" width="72" height="34" rx="17" fill="#0d1117" stroke="#61dafb" stroke-width="1.5"/>
    <text x="146" y="257" fill="#61dafb" text-anchor="middle">React</text>

    <!-- Next.js -->
    <rect x="192" y="235" width="86" height="34" rx="17" fill="#0d1117" stroke="#ffffff" stroke-width="1.5"/>
    <text x="235" y="257" fill="#ffffff" text-anchor="middle">Next.js</text>

    <!-- TypeScript -->
    <rect x="288" y="235" width="112" height="34" rx="17" fill="#0d1117" stroke="#3178c6" stroke-width="1.5"/>
    <text x="344" y="257" fill="#3178c6" text-anchor="middle">TypeScript</text>

    <!-- JavaScript -->
    <rect x="410" y="235" width="112" height="34" rx="17" fill="#0d1117" stroke="#f7df1e" stroke-width="1.5"/>
    <text x="466" y="257" fill="#f7df1e" text-anchor="middle">JavaScript</text>

    <!-- Node.js -->
    <rect x="532" y="235" width="92" height="34" rx="17" fill="#0d1117" stroke="#68a063" stroke-width="1.5"/>
    <text x="578" y="257" fill="#68a063" text-anchor="middle">Node.js</text>

    <!-- Express -->
    <rect x="634" y="235" width="92" height="34" rx="17" fill="#0d1117" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="680" y="257" fill="#e2e8f0" text-anchor="middle">Express</text>

    <!-- MongoDB -->
    <rect x="736" y="235" width="102" height="34" rx="17" fill="#0d1117" stroke="#47a248" stroke-width="1.5"/>
    <text x="787" y="257" fill="#47a248" text-anchor="middle">MongoDB</text>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
</svg>
